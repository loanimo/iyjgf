<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HEMA - Earn & Investment App</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS File -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-900 text-slate-100 font-sans pb-20">

    <!-- App Container -->
    <div id="app" class="max-w-md mx-auto bg-slate-950 min-h-screen relative shadow-2xl overflow-hidden border border-slate-800">
        
        <!-- Header -->
        <header class="bg-blue-600 p-4 text-white flex justify-between items-center shadow-md sticky top-0 z-20">
            <div class="flex items-center space-x-2.5">
                <!-- Profile / 'H' Letter Clickable -->
                <div onclick="openProfileModal()" class="bg-white text-blue-600 font-bold p-2 rounded-full w-9 h-9 flex items-center justify-center text-lg cursor-pointer shadow hover:bg-slate-100 transition" title="Profile">H</div>
                <div onclick="switchTab('home')" class="cursor-pointer">
                    <span class="text-xl font-bold tracking-wider">HEMA</span>
                </div>
            </div>
            <div class="flex items-center space-x-3">
                <button onclick="openAdminModal()" class="bg-blue-700 hover:bg-blue-800 text-xs px-3 py-1.5 rounded font-semibold transition border border-blue-400">
                    <i class="fa-solid fa-lock mr-1"></i> Admin
                </button>
            </div>
        </header>

        <!-- Main Content Area -->
        <main id="main-content" class="p-4 space-y-4">
            <!-- Dynamic Content Injected Here -->
        </main>

        <!-- Bottom Navigation Bar -->
        <nav id="bottom-nav" class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-md bg-slate-900 border-t border-slate-800 flex justify-around py-3 text-xs text-slate-400 z-20 shadow-lg hidden">
            <button onclick="switchTab('home')" id="nav-home" class="flex flex-col items-center text-blue-500">
                <i class="fa-solid fa-house text-lg mb-1"></i>
                <span>Home</span>
            </button>
            <button onclick="switchTab('tasks')" id="nav-tasks" class="flex flex-col items-center hover:text-blue-500">
                <i class="fa-solid fa-list-check text-lg mb-1"></i>
                <span>Tasks</span>
            </button>
            <button onclick="switchTab('plans')" id="nav-plans" class="flex flex-col items-center hover:text-blue-500">
                <i class="fa-solid fa-gem text-lg mb-1"></i>
                <span>Plans</span>
            </button>
            <button onclick="switchTab('chat')" id="nav-chat" class="flex flex-col items-center hover:text-blue-500 relative">
                <i class="fa-solid fa-headset text-lg mb-1"></i>
                <span>Live Chat</span>
            </button>
            <button onclick="switchTab('account')" id="nav-account" class="flex flex-col items-center hover:text-blue-500">
                <i class="fa-solid fa-user text-lg mb-1"></i>
                <span>Account</span>
            </button>
        </nav>

        <!-- Profile Modal -->
        <div id="profile-modal" class="fixed inset-0 bg-black/80 z-50 hidden flex items-center justify-center p-4">
            <div class="bg-slate-900 border border-slate-700 w-full max-w-sm rounded-xl p-5 space-y-4 relative">
                <button onclick="closeProfileModal()" class="absolute top-3 right-3 text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
                <div class="text-center space-y-2">
                    <div class="w-16 h-16 bg-blue-600 rounded-full mx-auto flex items-center justify-center text-2xl font-bold text-white shadow-lg">H</div>
                    <h3 id="profile-modal-email" class="font-bold text-sm text-white">user@gmail.com</h3>
                    <p class="text-xs text-blue-400">Active Plan: <span id="profile-modal-plan" class="font-semibold">Free Tier</span></p>
                </div>
                <div class="bg-slate-950 p-3 rounded-xl border border-slate-800 space-y-2 text-xs">
                    <div class="flex justify-between"><span class="text-slate-400">Balance:</span><span id="profile-modal-bal" class="text-emerald-400 font-bold">0.00 BDT</span></div>
                    <div class="flex justify-between"><span class="text-slate-400">Total Deposit:</span><span id="profile-modal-dep" class="text-blue-400 font-bold">0.00 BDT</span></div>
                </div>
                <button onclick="closeProfileModal(); switchTab('account');" class="w-full bg-blue-600 hover:bg-blue-700 py-2 rounded-lg text-xs font-semibold text-white">Account Settings</button>
            </div>
        </div>

        <!-- Admin Login / Panel Modal -->
        <div id="admin-modal" class="fixed inset-0 bg-black/80 z-50 hidden flex items-center justify-center p-4">
            <div class="bg-slate-900 border border-slate-700 w-full max-w-sm rounded-xl p-5 space-y-4 relative">
                <button onclick="closeAdminModal()" class="absolute top-3 right-3 text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
                <div id="admin-login-view">
                    <h3 class="text-lg font-bold text-blue-400 mb-2"><i class="fa-solid fa-shield-halved mr-2"></i>Admin Login</h3>
                    <p class="text-xs text-slate-400 mb-4">Enter secret password to access admin controls.</p>
                    <input type="password" id="admin-pass-input" placeholder="Enter Secret Password" class="w-full bg-slate-800 border border-slate-700 rounded p-2.5 text-sm text-white mb-3 focus:outline-none focus:border-blue-500">
                    <button onclick="verifyAdmin()" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-2 rounded font-semibold text-sm">Login to Admin</button>
                </div>
                <div id="admin-dashboard-view" class="hidden space-y-4 max-h-[80vh] overflow-y-auto pr-1">
                    <!-- Dynamic Admin Content -->
                </div>
            </div>
        </div>

    </div>

    <!-- Custom Script File -->
    <script src="script.js"></script>
</body>
</html>
